<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wano Admin</title>
<link rel="icon" href="/admin/logo.png">
<style>
  :root {
    --primary: #3AB586; --primary-dark: #2E9970; --light: #EBF8F3; --disabled: #9ED3BF;
    --text: #111; --muted: #6B6B6B; --grey: #98A2B3; --border: #E5E5E5; --bg: #F7F8F7; --card: #FFF;
    --danger: #E5484D; --danger-light: #FDECEC; --warn: #B7791F; --warn-light: #FFF7E6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  a { color: var(--primary-dark); text-decoration: none; font-weight: 500; } a:hover { text-decoration: underline; }

  /* login */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
                border-radius: 16px; padding: 32px 24px; }
  .login-card img { height: 30px; display: block; margin: 0 auto 8px; }
  .login-card h1 { font-size: 17px; font-weight: 600; text-align: center; margin: 0 0 24px; color: var(--muted); }

  /* layout */
  header { background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center;
           gap: 12px; padding: 10px 20px; position: sticky; top: 0; z-index: 5; }
  header img { height: 22px; }
  header .tag { font-size: 12px; font-weight: 600; color: var(--primary); background: var(--light);
                padding: 3px 8px; border-radius: 999px; }
  header .who { margin-left: auto; color: var(--muted); font-size: 14px; }
  .shell { display: flex; max-width: 1180px; margin: 0 auto; }
  nav { width: 200px; flex-shrink: 0; padding: 16px 12px; position: sticky; top: 49px; align-self: flex-start; }
  nav button { display: flex; width: 100%; justify-content: space-between; align-items: center; text-align: left;
               background: none; border: 0; padding: 10px 12px; border-radius: 10px; cursor: pointer;
               font-weight: 500; color: var(--text); }
  nav button:hover { background: #EEF1EF; }
  nav button.on { background: var(--light); color: var(--primary-dark); }
  nav .count { background: var(--danger); color: #fff; font-size: 12px; border-radius: 999px; padding: 0 7px;
               min-width: 20px; text-align: center; }
  main { flex: 1; min-width: 0; padding: 20px 20px 60px; }
  h2 { font-size: 22px; margin: 4px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
          margin-bottom: 14px; }
  .card h3 { font-size: 16px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: default; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .stat .hint { color: var(--grey); font-size: 13px; }
  .stat.link { cursor: pointer; } .stat.link:hover { border-color: var(--primary); }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.space { justify-content: space-between; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number], input[type=datetime-local], input[type=month],
  textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
                     background: #fff; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--primary); }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer;
         background: var(--primary); color: #fff; white-space: nowrap; }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background: var(--disabled); cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn.secondary:hover { background: var(--light); }
  .btn.danger { background: var(--danger); } .btn.danger:hover { background: #C93B40; }
  .btn.ghost-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn.block { width: 100%; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
       letter-spacing: .03em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; }
  .pill.green { background: var(--light); color: var(--primary-dark); }
  .pill.red { background: var(--danger-light); color: var(--danger); }
  .pill.grey { background: #F0F1F3; color: var(--muted); }
  .pill.amber { background: var(--warn-light); color: var(--warn); }
  .warn { background: var(--warn-light); color: #7A5413; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* switches */
  .switch-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .switch-row:last-child { border-bottom: 0; }
  .switch-row .txt { flex: 1; }
  .switch-row .name { font-weight: 600; }
  .toggle { position: relative; width: 48px; height: 28px; flex-shrink: 0; border: 0; border-radius: 999px;
            background: #D0D5DD; cursor: pointer; transition: background .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
                   background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .toggle.on { background: var(--primary); } .toggle.on::after { left: 23px; }
  .toggle:disabled { opacity: .5; cursor: wait; }

  .checks { list-style: none; padding: 0; margin: 0; }
  .checks li { display: flex; gap: 8px; padding: 5px 0; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center;
         justify-content: center; font-size: 12px; color: #fff; margin-top: 2px; }
  .dot.ok { background: var(--primary); } .dot.no { background: var(--danger); }
  .thumb { width: 44px; height: 60px; border-radius: 8px; object-fit: cover; background: #EEE; flex-shrink: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* modal and toast */
  #modal { position: fixed; inset: 0; background: rgba(17,17,17,.45); display: flex; align-items: center;
           justify-content: center; padding: 16px; z-index: 20; }
  #modal .box { background: #fff; border-radius: 16px; padding: 22px; max-width: 440px; width: 100%; }
  #modal h3 { margin: 0 0 8px; font-size: 18px; }
  #modal p { margin: 0 0 18px; color: var(--muted); white-space: pre-line; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff;
           padding: 10px 18px; border-radius: 999px; z-index: 30; font-size: 14px; max-width: calc(100% - 32px); }
  #toast.err { background: var(--danger); }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    nav { width: 100%; position: static; display: flex; overflow-x: auto; gap: 4px; padding: 8px 12px; }
    nav button { width: auto; gap: 6px; white-space: nowrap; flex-shrink: 0; }
    main { padding: 12px 16px 60px; }
    .two { grid-template-columns: 1fr; }
    td, th { padding: 10px 6px; }
    header .who { display: none; }
  }
</style>
</head>
<body>
  <section id="login" class="hidden">
    <form class="login-card" id="login-form">
      <img src="/admin/logo.png" alt="Wano">
      <h1>Admin</h1>
      <label class="field"><span>Username, email or phone</span><input type="text" id="login-user" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" id="login-pass" autocomplete="current-password" required></label>
      <button class="btn block" type="submit" id="login-btn">Log in</button>
      <p class="small muted" id="login-err" style="color: var(--danger); min-height: 20px; margin: 12px 0 0;"></p>
    </form>
  </section>

  <section id="app" class="hidden">
    <header>
      <img src="/admin/logo.png" alt="Wano">
      <span class="tag">Admin</span>
      <span class="who" id="who"></span>
      <button class="btn secondary small" id="logout">Log out</button>
    </header>
    <div class="shell">
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>
  </section>

  <div id="modal" class="hidden">
    <div class="box">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <div class="row" style="justify-content: flex-end;">
        <button class="btn secondary" id="modal-no">Cancel</button>
        <button class="btn" id="modal-yes">Confirm</button>
      </div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>
  <script src="/admin/app.js"></script>
</body>
</html>
